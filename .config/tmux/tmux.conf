# Powerline
run-shell "powerline-daemon -q"
#source "/usr/lib/python3.13/site-packages/powerline/config.py"



# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'erikw/tmux-powerline'
set-option -g set-titles on

# Mouse Support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#theme
#set -g @plugin "janoamaral/tokyo-night-tmux"
#set -g @plugin 'seebi/tmux-colors-solarized'
#set -g @colors-solarized 'dark'
set -g default-terminal "tmux-256color"
#set-option -sa terminal-overrides "xterm*:colors=256"
set -ag terminal-overrides ",xterm-256color:RGB"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# keybindings
#unbind-key C-l
#bind-key C-l send-keys 'C-l'
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# Prefix 
unbind-key C-b
set -g prefix `
bind ` send-prefix

# Closes window 
bind-key -n C-x kill-window

# Creates window 
bind-key -n C-n new-window

#history-limit
set -g history-limit 100000

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


#Statusbar 
#set -g status-bg "#192330"
#set -g status-fg "#63CDCF"
#set-option -g status-right "#[fg="#DBC074"] %a %d %b %I:%M %p"
#set-option -g status-position bottom
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


